# Locked strategy rules. Pre-registered before any results were seen. Do not tune.
seasons:
  train: ["2023-24", "2024-25"]   # NOTE: Kalshi coverage may not reach these; see PHASE0.md
  holdout: ["2025-26"]

s6_early_deficit_favorite:
  max_pregame_spread: -4.0        # favorite = closing spread <= -4.0
  deficit: 10                     # primary
  deficit_variations: [8, 10, 12] # report all
  periods: [1, 2]
  one_bet_per_game: true

s7_fade_the_run:
  run_size: 10                    # primary
  run_size_variations: [8, 10, 12]
  max_run_game_clock_sec: 180     # run within <= 3:00 of game clock
  max_wallclock_lag_sec: 300      # bet at first price <= 5 min after run qualifies
  exclude_q4_under_sec: 120       # skip Q4 (and OT) with < 2:00 left
  one_bet_per_game_per_team: true

kalshi:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  game_series: KXNBAGAME
  series_prefix: KXNBA            # discover spread/total series under this prefix
  min_request_interval_sec: 0.1

oddspapi:
  base_url: https://api.oddspapi.io/v4
  key_env: ODDSPAPI_KEY
  bookmakers: [pinnacle, draftkings, fanduel]   # max 3 per historical call

alignment:
  # a price is joined to the latest PBP event at or before its UTC timestamp
  max_staleness_sec: 180
